version: '3'
services:
    api:
        build: .
        ports:
            - '3001:3001'
        env_file:
            - .env.docker
        depends_on:
            - db
    db:
        image: postgres:15-alpine
        ports:
            - 5432:5432
        environment:
            - POSTGRES_PASSWORD={DB_PASSWORD:-password}
            - POSTGRES_USER={DB_USER:-user}
            - POSTGRES_DB={DB_NAME:-task_manager_flow_db}
