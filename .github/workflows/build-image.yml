name: Build and Package Docker
on:
  push:
    branches: ['main'] # Triggers every time you push to main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-nestjs-app:latest .

      - name: Save Image as File
        run: docker save my-nestjs-app:latest > my-app-image.tar

      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-docker-image
          path: my-app-image.tar
